[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
# Tell Netlify's secrets scanner these env keys are expected server-side
SECRETS_SCAN_OMIT_KEYS = "FIREBASE_ADMIN_PRIVATE_KEY,FIREBASE_ADMIN_CLIENT_EMAIL,FIREBASE_ADMIN_PROJECT_ID,MONGO_URI"
